[project]
name = "geodesic-splines"
version = "0.2.0"
description = "Interactive multi-spline editor for triangulated meshes with hybrid geodesic Bezier curves."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10",
    "pyvista>=0.42",
    "vtk>=9.2",
    "potpourri3d>=1.2",
]

[project.optional-dependencies]
jit = ["numba>=0.58"]
# Ruff version is pinned (and matched in .pre-commit-config.yaml +
# .github/workflows/ci.yml) so the same version flags the same
# issues everywhere — no drift between contributor pre-commit, CI,
# and ad-hoc ``pip install -e .[dev]`` installs.
dev = [
    "ruff~=0.7.0",
    "pytest>=8",
    "mypy>=1.10",
]

[project.scripts]
geo-splines = "geo_splines:_cli_main"
spline-export = "spline_export:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["geo_splines", "geo_shoot", "geodesics", "gizmo", "spline_export", "session_io"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", ".venv", "tests/_data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines: docstrings/comments routinely exceed 100 cols
    # The scalar JIT kernels lay out one vector operation per line with
    # the x/y/z components separated by semicolons
    # (``p1x = ...;  p1y = ...;  p1z = ...`` — see _parallel_transport).
    # That SIMD-style grouping is deliberate and more legible than
    # tripling the line count; E701/E702 would force the expansion.
    "E701",
    "E702",
    # ``isinstance(x, (A, B))`` is faster than the PEP 604 union form
    # (no ``__instancecheck__`` on a types.UnionType) and UP038 was
    # later deprecated upstream for exactly that reason.
    "UP038",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
files = [
    "geodesics.py",
    "gizmo.py",
    "geo_shoot.py",
    "geo_splines.py",
    "spline_export.py",
    "session_io.py",
]
# UI modules (geo_shoot / geo_splines) lean heavily on dynamic VTK/PyVista
# attributes; loosen the strictness there until the call sites are typed.
disable_error_code = ["attr-defined", "arg-type", "assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# Collect the profiling/parity harness too — its filename doesn't match
# the default ``test_*.py`` glob, so without this its
# ``test_orange_cascade_benchmark`` correctness net (the only automated
# end-to-end check of the export cascade) was silently never collected.
# It carries the ``benchmark`` marker and is deselected from the slim CI
# matrix via ``-m "not benchmark"``.
python_files = ["test_*.py", "benchmark_*.py"]
markers = [
    "benchmark: in-process perf benchmark for the geodesic core; needs full deps (vtk/pyvista/potpourri3d) + a mesh, so excluded from the slim CI matrix.",
    "gpu: requires a GPU / hardware-accelerated VTK context.",
    "gui: requires an interactive plotter window.",
]
