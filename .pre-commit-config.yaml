repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
        exclude: '\.(obj|ply|stl|json)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: ["--fix"]
      # No ruff-format hook: the codebase deliberately hand-aligns
      # HUD-string dicts and lays out JIT-kernel scalar math in
      # semicolon-grouped lines; the formatter would flatten both.
      # Style is enforced by lint rules (see [tool.ruff.lint]) only.
