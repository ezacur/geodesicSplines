name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        # Pin matches .pre-commit-config.yaml and pyproject.toml's
        # [project.optional-dependencies].dev — keeps lint output
        # identical across contributor / pre-commit / CI.
        run: pip install 'ruff~=0.7.0'
      - name: Ruff lint
        # No ``ruff format --check`` step: the codebase deliberately
        # hand-aligns HUD-string dicts and groups JIT-kernel scalar
        # math with semicolons — the formatter would flatten both.
        # Style is enforced through lint rules only (pyproject.toml).
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # potpourri3d needs a C++17 compiler at install time and pyvista
        # pulls in VTK which is multi-hundred-MB on Linux runners.  Both
        # are required by the editor, but the headless tests here only
        # exercise pure-Python code paths (JSON validation, helpers) so
        # we install a slim subset that completes in seconds.
        run: |
          pip install --upgrade pip
          pip install numpy scipy pytest
      - name: Run pure-Python tests
        # ``benchmark`` needs the full deps (vtk/pyvista/potpourri3d) + a
        # mesh, none of which are installed here — excluded explicitly in
        # addition to its own skip guard.
        run: pytest tests/ -m "not gpu and not gui and not benchmark" -q
