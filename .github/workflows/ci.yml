name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        # Pin matches .pre-commit-config.yaml and pyproject.toml's
        # [project.optional-dependencies].dev — keeps lint output
        # identical across contributor / pre-commit / CI.
        run: pip install 'ruff~=0.7.0'
      - name: Ruff lint
        # No ``ruff format --check`` step: the codebase deliberately
        # hand-aligns HUD-string dicts and groups JIT-kernel scalar
        # math with semicolons — the formatter would flatten both.
        # Style is enforced through lint rules only (pyproject.toml).
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy + the typed runtime deps
        # Pin matches pyproject.toml's [project.optional-dependencies].dev,
        # same rationale as the ruff pin above: a new mypy minor adds
        # checks, and CI going red on a dependency bump nobody made is
        # how a type gate gets switched off.
        #
        # ``ignore_missing_imports = true`` ([tool.mypy]) covers vtk /
        # pyvista / potpourri3d — they ship no stubs and would cost a
        # multi-hundred-MB install for nothing.  numpy and scipy DO ship
        # ``py.typed``, so installing them is what makes this run
        # actually check the array code instead of silently degrading
        # every annotation to ``Any``.
        run: |
          pip install --upgrade pip
          pip install 'mypy~=1.11.0' numpy scipy
      - name: mypy
        # No arguments: files and settings come from [tool.mypy], so
        # this is byte-identical to a bare ``mypy`` in the repo root.
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # potpourri3d needs a C++17 compiler at install time and pyvista
        # pulls in VTK which is multi-hundred-MB on Linux runners.  Both
        # are required by the editor, but the headless tests here only
        # exercise pure-Python code paths (JSON validation, helpers) so
        # we install a slim subset that completes in seconds.
        run: |
          pip install --upgrade pip
          pip install numpy scipy pytest
      - name: Run pure-Python tests
        # ``benchmark`` needs the full deps (vtk/pyvista/potpourri3d) + a
        # mesh, none of which are installed here — excluded explicitly in
        # addition to its own skip guard.
        run: pytest tests/ -m "not gpu and not gui and not benchmark" -q

  # Full-dependency job: the slim ``test`` job above installs only
  # numpy/scipy, so every test that does ``importorskip("vtk")`` — i.e.
  # the entire geodesic core (astar, subdivision, short_geodesic,
  # find_faces, chord-degraded, geo_core) — silently skips there.  This
  # job installs the real runtime + Numba and actually exercises them,
  # including the ``benchmark`` cascade parity net (fandisk.obj ships in
  # the repo).  Single Python version, headless (offscreen VTK); allowed
  # to be slower than the slim matrix.
  test-full:
    runs-on: ubuntu-latest
    env:
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install full runtime + JIT + test deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[jit]
          pip install pytest
      - name: Run full test suite (incl. benchmark parity net)
        run: pytest tests/ -m "not gpu and not gui" -q
